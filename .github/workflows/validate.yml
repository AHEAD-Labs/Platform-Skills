# Skill check for Platform-Skills (public repository).
#
# - Trigger: pull_request (NOT pull_request_target). The token is read-only (contents: read), no
#   secrets are used, the PR's content is treated as data, and nothing is published, merged,
#   written back or approved by this workflow. No paths filter: a required check that a filter
#   skips would never report.
# - Two jobs so a reviewer can tell them apart:
#     unit-tests         fails => the tooling itself is broken (fix tools/ or tests/).
#     skill-policy-gate  fails => something in the tree breaks the contribution rules. Every
#                        problem is listed in the job summary and as an annotation on the file,
#                        each with how to fix it. Warnings never fail the check.
# - The check runs the BASE branch's copy of tools/skillpkg.py against the PR's files, so a PR
#   cannot pass itself by editing the tool. It scans the whole tree, never only the changed paths.
#   Residual risk: a PR can still edit THIS file. Mitigation is code-owner review of .github/**
#   plus branch protection, not anything a workflow can enforce on itself.
# - Approval is a human code-owner review of the PR. The Skills Auditor is paused and is not part
#   of this check.
name: validate-skills

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -B -m unittest discover -s tests -v

  skill-policy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Skill check (base branch tool, whole tree)
        # The tool writes annotations and the job summary itself (GITHUB_ACTIONS, GITHUB_STEP_SUMMARY).
        run: |
          TOOL="$RUNNER_TEMP/base/tools/skillpkg.py"
          if [ ! -f "$TOOL" ]; then
            echo "::warning::Bootstrap: base branch has no tools/skillpkg.py; using the PR's copy. Review tools/ changes manually."
            TOOL=tools/skillpkg.py
          fi
          python3 -I "$TOOL" ci --root . --trusted-root "$RUNNER_TEMP/base"
